    <!-- Detail + Notion blocks -->
    <main class="detail main-panel" id="main-panel">

      <div class="empty-state" id="detail-empty">
        <div class="empty-icon">📋</div>
        <h3 class="empty-title">Select a question</h3>
        <p class="empty-desc">Pick a card in the feed or press <kbd class="kbd-pill">⌘E</kbd> to search everything.</p>
        <div class="kbd-hint">
          <div class="kbd-hint-item"><kbd>J</kbd> / <kbd>K</kbd> Navigate</div>
          <div class="kbd-hint-item"><kbd>Space</kbd> Reveal</div>
          <div class="kbd-hint-item"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> Rate</div>
        </div>
      </div>

      <div class="detail-inner hidden" id="detail-question">

        <div class="detail-hd">
          <div class="q-header">
            <div class="hist-nav">
              <button type="button" class="hist-btn" id="hist-back" onclick="historyBack()" disabled title="Back">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
              </button>
              <button type="button" class="hist-btn" id="hist-fwd" onclick="historyForward()" disabled title="Forward">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
              </button>
            </div>
            <span class="q-header-num" id="qv-num">#1</span>
            <span class="q-header-star" id="qv-star"></span>
            <span class="diff-badge" id="qv-diff">Easy</span>
            <span class="meta-badge meta-sec" id="qv-section" hidden></span>
            <div class="rating-bar memory-detail-rating hidden" id="rating-bar">
              <div class="memory-detail-field">
                <label class="sr-only" for="detail-memory-range">How well you remembered this answer</label>
                <input type="range" id="detail-memory-range" class="memory-range" min="0" max="3" step="1" value="1" aria-valuemin="0" aria-valuemax="3" aria-valuenow="1" aria-valuetext="Forgot" />
                <div class="memory-range-labels" aria-hidden="true">
                  <span class="memory-range-lbl" data-step="0">Unseen</span>
                  <span class="memory-range-lbl" data-step="1">Forgot</span>
                  <span class="memory-range-lbl" data-step="2">Shaky</span>
                  <span class="memory-range-lbl" data-step="3">Knew</span>
                </div>
              </div>
            </div>
          </div>
          <h1 class="detail-title" id="detail-title"></h1>
        </div>

        <button type="button" class="quiz-reveal-cover hidden" id="quiz-reveal-cover" aria-label="Reveal answer">
          <span class="quiz-reveal-icon" aria-hidden="true">🃏</span>
          <span class="quiz-reveal-title">Reveal answer</span>
          <span class="quiz-reveal-hint">Click or press <kbd class="kbd-pill">Space</kbd></span>
        </button>

        <div class="detail-body" id="detail-body"></div>

        <div class="bottom-bar" id="bottom-bar">
          <div class="bb-col bb-tags-wrap">
            <div class="bb-label">Tags</div>
            <div class="bb-tags" id="bb-tags"></div>
          </div>
          <div class="bb-col bb-related-wrap">
            <div class="bb-label">Related</div>
            <div class="bb-related" id="bb-related"></div>
          </div>
        </div>

        <div class="flashcard legacy-flashcard hidden" id="flashcard" aria-hidden="true">
          <div class="card-hidden" id="card-hidden-face">
            <div class="card-reveal-icon">🃏</div>
            <div class="card-reveal-text">Reveal</div>
          </div>
          <div class="card-content hidden" id="card-revealed-face">
            <div class="answer-content" id="answer-content"></div>
            <div id="detail-sections"></div>
          </div>
        </div>

        <div class="meta-section hidden" id="meta-section" aria-hidden="true">
          <div class="meta-row">
            <span class="meta-label">Tags</span>
            <div class="meta-chips" id="meta-tags"></div>
          </div>
          <div class="meta-row">
            <span class="meta-label">Related</span>
            <div class="related-list" id="meta-related"></div>
          </div>
        </div>
      </div>

      <!-- Roadmap mode. A sibling `.detail-inner`, so it inherits the pane's
           flex behaviour, its scroll and the named `detail` container, and it
           replaces the question view (per-question header, rating slider and
           the Tags/Related bottom bar are all part of #detail-question).
           `.roadmap-head` is pinned with position: sticky inside this one
           scroller; there is deliberately no second scroll box below it. -->
      <div class="detail-inner roadmap hidden" id="detail-roadmap" role="region" aria-labelledby="roadmap-title">
        <div class="roadmap-head">
          <div class="roadmap-head-row">
            <h2 class="roadmap-title" id="roadmap-title">🗺️ Roadmap</h2>
            <span class="roadmap-aggregate" id="roadmap-aggregate"></span>
            <button type="button" class="roadmap-jump" id="roadmap-jump" onclick="roadmapJumpToCurrent()"
              title="Scroll to the band holding the open question">Jump to current</button>
          </div>
          <div class="roadmap-legend" aria-hidden="true">
            <span class="roadmap-legend-item"><span class="roadmap-swatch rm-mem-0"></span>Unseen</span>
            <span class="roadmap-legend-item"><span class="roadmap-swatch rm-mem-1"></span>Forgot</span>
            <span class="roadmap-legend-item"><span class="roadmap-swatch rm-mem-2"></span>Shaky</span>
            <span class="roadmap-legend-item"><span class="roadmap-swatch rm-mem-3"></span>Knew</span>
            <span class="roadmap-legend-sep" aria-hidden="true"></span>
            <span class="roadmap-legend-item"><span class="roadmap-shape rm-shape-E"></span>Easy</span>
            <span class="roadmap-legend-item"><span class="roadmap-shape rm-shape-M"></span>Medium</span>
            <span class="roadmap-legend-item"><span class="roadmap-shape rm-shape-H"></span>Hard</span>
          </div>
        </div>
        <div class="roadmap-rail" id="roadmap-rail"></div>
        <div class="roadmap-bands" id="roadmap-bands"></div>
      </div>
    </main>
