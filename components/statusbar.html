  <!-- Status bar (Jira-inspired legend + live context) -->
  <footer class="app-statusbar statusbar" id="app-statusbar">
    <span class="si-topic" id="si-topic"></span>
    <span class="si-crumb">·</span>
    <span class="si-section" id="si-section"></span>
    <span class="si-crumb">·</span>
    <span class="si-progress" id="si-progress"></span>
    <div class="si-right">
      <div class="si-data-actions" role="group" aria-label="Export or import progress">
        <button type="button" class="si-data-btn" id="si-export" title="Download ratings and seen progress as JSON">Export</button>
        <button type="button" class="si-data-btn" id="si-import" title="Merge ratings and seen state from a JSON file">Import</button>
        <input type="file" id="import-input" class="sr-only" accept="application/json,.json" tabindex="-1" aria-hidden="true">
      </div>
      <span class="status-sep"></span>
      <span class="saved-wrap" title="Saved to local storage">
        <span class="saved-dot" id="saved-dot"></span>
        <span class="saved-text">Saved</span>
      </span>
    </div>
  </footer>
