<aside class="sidebar">
      <div class="sb-header">
        <div class="sb-label">Sections</div>
      </div>
      <div id="sb-list" class="sb-list"></div>

      <div class="divider"></div>

      <div class="filter-group">

        <!-- Tag filter - searchable, sits right above Difficulty -->
        <div class="tag-filter-section" id="tag-filter-section">
          <div class="sb-label-row">
            <div class="sb-label tag-filter-title">Tags</div>
            <button type="button" class="tag-clear-all" id="tag-clear-all" title="Clear all selected tags" aria-label="Clear all selected tags" hidden>
              <span aria-hidden="true">✕</span>
            </button>
          </div>
          <div class="tag-search-wrapper">
            <input type="text" id="tag-search-input" class="tag-search-input" placeholder="Search tags..." autocomplete="off" />
            <div class="tag-search-results hidden" id="tag-search-results"></div>
          </div>
          <div class="tag-filter-selected" id="tag-filter-selected"></div>
        </div>

        <div class="sb-label sb-label-spaced">Difficulty</div>
        <div id="diff-chips" class="filter-chips filter-chips-diff">
          <button type="button" class="chip" data-diff="E" data-chip-label="Easy" title="Easy">
            <span class="chip-label">Easy</span>
            <span class="chip-count">(0)</span>
          </button>
          <button type="button" class="chip" data-diff="M" data-chip-label="Medium" title="Medium">
            <span class="chip-label">Medium</span>
            <span class="chip-count">(0)</span>
          </button>
          <button type="button" class="chip" data-diff="H" data-chip-label="Hard" title="Hard">
            <span class="chip-label">Hard</span>
            <span class="chip-count">(0)</span>
          </button>
        </div>

        <div class="sb-label sb-label-spaced">Importance</div>
        <div id="importance-chips" class="filter-chips filter-chips-importance">
          <button type="button" class="chip importance-chip" data-status="star" data-chip-label="Important" title="Important questions">
            <span class="importance-icon">⭐</span>
            <span class="importance-label">Important</span>
            <span class="chip-count">(0)</span>
          </button>
        </div>

        <div class="sb-label sb-label-spaced">Memory</div>
        <div class="memory-indicator-container">
          <div class="memory-progress-bar">
            <div class="memory-track"></div>
            <input type="range" id="sidebar-memory-range" class="memory-range enhanced-memory-range" min="0" max="3" step="1" value="0" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0" aria-valuetext="Unseen" title="Double-click to clear filter" />
          </div>
          <div class="memory-labels-enhanced" aria-hidden="true">
            <span class="memory-lbl-enhanced" data-step="0">UNSEEN</span>
            <span class="memory-lbl-enhanced" data-step="1">FORGOT</span>
            <span class="memory-lbl-enhanced" data-step="2">SHAKY</span>
            <span class="memory-lbl-enhanced" data-step="3">KNEW</span>
          </div>
        </div>
      </div>
    </aside>
