<div id="cmd-overlay" class="cmd-overlay hidden" aria-hidden="true">
  <div class="cmd-backdrop"></div>
  <div class="cmd-panel" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="cmd-panel-head">
      <span class="cmd-wedge" aria-hidden="true">⌘</span>
      <input type="search" id="cmd-input" class="cmd-input" placeholder="Jump to any question…" autocomplete="off" spellcheck="false">
      <span class="cmd-esc">Esc</span>
    </div>
    <div id="cmd-results" class="cmd-results" role="listbox"></div>
    <div class="cmd-footer">
      <span class="cmd-hint"><kbd class="kbd-tiny">↑↓</kbd> navigate</span>
      <span class="cmd-hint"><kbd class="kbd-tiny">↵</kbd> open</span>
      <span class="cmd-hint"><kbd class="kbd-tiny">Esc</kbd> close</span>
    </div>
  </div>
</div>
