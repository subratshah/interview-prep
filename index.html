- Thinks through error states and edge cases from the user's perspective, not just the happy path\n- Has used user-facing metrics (crash rate, latency, retention) to guide technical priorities\n- Understands that technical debt and reliability directly affect users\n\n**STAR hint:** \"Give me an example of a technical decision where the right answer was driven by what users would experience.\"\n\n**Red flags:**\n- \"That's the PM's job\" — abdication of any responsibility for user outcomes\n- Purely inward-facing technical thinking: performance matters because it's elegant, not because it affects users\n- No mention of users, customers, or the end experience in technical reasoning\n- Optimizes for developer experience exclusively with no connection to user impact", "tags": ["culture", "product"], "related": ["behav-17", "behav-6"]}];
  // ─────────────────────────────────────────────

  // ── State ──────────────────────────────────────────────────
  const state = {
    activeTab: 'technical',
    searchQuery: '',
    diffFilters: new Set(),  // empty = show all
    statusFilter: null,    // null | 'star' | 'know' | 'shaky' | 'review' | 'unseen'
    tagFilter: null,       // null | string
    selectedId: null,
    cardRevealed: false,
    learningMode: false,
    ratings: {},           // { [id]: 'know' | 'shaky' | 'review' }
    history: [],           // array of question IDs visited
    historyIdx: -1,        // current position in history
  };

  // ── Persistence ─────────────────────────────────────────────
  function loadRatings() {
    try {
      const raw = localStorage.getItem('interview-ratings');
      if (raw) state.ratings = JSON.parse(raw);
    } catch (e) {}
  }

  function saveRatings() {
    try {
      localStorage.setItem('interview-ratings', JSON.stringify(state.ratings));
    } catch (e) {}
  }

  // ── Helpers ──────────────────────────────────────────────────
  function getRating(id) {
    return state.ratings[id] || null;
  }

  function getQuestionById(id) {
    return questions.find(q => q.id === id) || null;
  }

  function getFilteredQuestions() {
    return questions.filter(q => {
      // When searching, show all types; otherwise filter by active tab
      if (!state.searchQuery && q.type !== state.activeTab) return false;
      if (state.diffFilters.size > 0 && !state.diffFilters.has(q.difficulty)) return false;
      if (state.searchQuery) {
        const lower = state.searchQuery.toLowerCase();
        if (!q.title.toLowerCase().includes(lower) &&
            !q.section.toLowerCase().includes(lower) &&
            !(q.tags || []).some(t => t.toLowerCase().includes(lower))) {
          return false;
        }
      }
      if (state.statusFilter) {
        if (state.statusFilter === 'star') {
          if (!q.star) return false;
        } else if (state.statusFilter === 'unseen') {
          if (getRating(q.id) !== null) return false;
        } else {
          if (getRating(q.id) !== state.statusFilter) return false;
        }
      }
      if (state.tagFilter) {
        if (!(q.tags || []).includes(state.tagFilter)) return false;
      }
      return true;
    });
  }

  function sortBySectionRelevance(items) {
    if (items.length <= 2) return items;
    const ids = new Set(items.map(q => q.id));
    const intraDegree = id => (items.find(q => q.id === id)?.related || []).filter(r => ids.has(r)).length;

    const placed = [];
    const remaining = new Set(items.map(q => q.id));

    // Seed: most intra-connections first, then original order as tiebreak
    const seed = [...remaining].sort((a, b) => intraDegree(b) - intraDegree(a))[0];
    placed.push(seed);
    remaining.delete(seed);

    while (remaining.size > 0) {
      let best = null, bestScore = -1;
      for (const id of remaining) {
        const score = (items.find(q => q.id === id)?.related || []).filter(r => placed.includes(r)).length;
        if (score > bestScore) { bestScore = score; best = id; }
      }
      // If no connections found, pick first remaining (preserves original order for disconnected Qs)
      if (!best) best = [...remaining][0];
      placed.push(best);
      remaining.delete(best);
    }

    const order = new Map(placed.map((id, i) => [id, i]));
    return [...items].sort((a, b) => order.get(a.id) - order.get(b.id));
  }

  function getSortedFilteredQuestions() {
    const filtered = getFilteredQuestions();
    const groups = groupBySection(filtered); // already applies relevance sort
    return groups.flatMap(g => g.items);
  }

  function groupBySection(qs) {
    const groups = {};
    const order = [];
    qs.forEach(q => {
      if (!groups[q.section]) {
        groups[q.section] = [];
        order.push(q.section);
      }
      groups[q.section].push(q);
    });
    return order.map(sec => ({ section: sec, items: sortBySectionRelevance(groups[sec]) }));
  }

  // ── Render sidebar list ────────────────────────────────────────
  function renderList() {
    const list = document.getElementById('question-list');
    const countEl = document.getElementById('results-count');
    const emptyMsg = document.getElementById('empty-list-msg');

    const filtered = getFilteredQuestions();
    countEl.textContent = `${filtered.length} question${filtered.length !== 1 ? 's' : ''}`;

    // Update dropdown option label with count
    const opt = document.querySelector(`#topic-select option[value="${state.activeTab}"]`);
    if (opt) {
      const base = state.activeTab === 'technical' ? 'Android' : 'Behaviour';
      opt.textContent = `${base} (${filtered.length})`;
    }

    // Clear
    list.innerHTML = '';

    if (filtered.length === 0) {
      const div = document.createElement('div');
      div.className = 'empty-list';
      div.textContent = questions.length === 0 ? 'No questions loaded.' : 'No questions match your filters.';
      list.appendChild(div);
      return;
    }

    const groups = groupBySection(filtered);

    groups.forEach(({ section, items }) => {
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = state.searchQuery ? `[${items[0].type === 'technical' ? 'Android' : 'Behaviour'}] ${section}` : section;
      list.appendChild(label);

      const divider = document.createElement('div');
      divider.className = 'section-divider';
      list.appendChild(divider);

      items.forEach(q => {
        const rating = getRating(q.id);
        const item = document.createElement('div');
        item.className = 'q-item' + (q.id === state.selectedId ? ' selected' : '');
        item.dataset.id = q.id;
        item.innerHTML = `
          <span class="q-num">#${q.num}</span>
          <span class="q-diff-badge ${q.difficulty}">${q.difficulty}</span>
          <span class="q-title">${escapeHtml(q.title)}</span>
          ${q.star ? '<span class="q-star">⭐</span>' : ''}
          <span class="status-dot ${rating || ''}"></span>
        `;
        item.addEventListener('click', () => selectQuestion(q.id));
        list.appendChild(item);
      });
    });
  }

  // ── Select a question ──────────────────────────────────────────
  function selectQuestion(id) {
    // Push to history (only if not navigating via history buttons)
    if (!state._historyNav) {
      // Truncate forward history
      state.history = state.history.slice(0, state.historyIdx + 1);
      state.history.push(id);
      state.historyIdx = state.history.length - 1;
    }
    state._historyNav = false;

    state.selectedId = id;
    state.cardRevealed = false;
    renderList();
    renderMainPanel();
    // Auto-reveal in learning mode
    if (state.learningMode) {
      setTimeout(() => revealCard(), 0);
    }
    // Scroll selected into view
    const el = document.querySelector('.q-item.selected');
    if (el) el.scrollIntoView({ block: 'nearest' });
    updateHistoryButtons();
  }

  // ── Render main panel ──────────────────────────────────────────
  function renderMainPanel() {
    const emptyState = document.getElementById('empty-state');
    const questionView = document.getElementById('question-view');

    if (!state.selectedId) {
      emptyState.classList.remove('hidden');
      questionView.classList.add('hidden');
      return;
    }

    const q = getQuestionById(state.selectedId);
    if (!q) {
      emptyState.classList.remove('hidden');
      questionView.classList.add('hidden');
      return;
    }

    emptyState.classList.add('hidden');
    questionView.classList.remove('hidden');

    // Header
    document.getElementById('qv-num').textContent = `#${q.num}`;
    const diffBadge = document.getElementById('qv-diff');
    diffBadge.className = `diff-badge ${q.difficulty}`;
    const diffMap = { E: 'Easy', M: 'Medium', H: 'Hard' };
    diffBadge.textContent = diffMap[q.difficulty] || q.difficulty;
    document.getElementById('qv-star').textContent = q.star ? '⭐' : '';
    document.getElementById('qv-section').textContent = q.section;
    document.getElementById('qv-title').textContent = q.title;

    // Flashcard faces
    const hiddenFace = document.getElementById('card-hidden-face');
    const revealedFace = document.getElementById('card-revealed-face');
    const ratingBar = document.getElementById('rating-bar');
    const metaSection = document.getElementById('meta-section');

    if (state.cardRevealed) {
      hiddenFace.classList.add('hidden');
      revealedFace.classList.remove('hidden');
      ratingBar.classList.remove('hidden');
      metaSection.classList.remove('hidden');

      // Render answer
      document.getElementById('answer-content').innerHTML = typeof marked !== 'undefined'
        ? marked.parse(q.answer || '')
        : `<p>${escapeHtml(q.answer || '')}</p>`;

      // Render tags
      const tagsEl = document.getElementById('meta-tags');
      tagsEl.innerHTML = '';
      (q.tags || []).forEach(tag => {
        const chip = document.createElement('span');
        chip.className = 'tag-chip' + (state.tagFilter === tag ? ' active' : '');
        chip.textContent = tag;
        chip.addEventListener('click', () => filterByTag(tag));
        tagsEl.appendChild(chip);
      });
      if ((q.tags || []).length === 0) {
        tagsEl.innerHTML = '<span class="no-related">None</span>';
      }

      // Render related
      const relatedEl = document.getElementById('meta-related');
      relatedEl.innerHTML = '';
      (q.related || []).forEach(relId => {
        const rel = getQuestionById(relId);
        if (!rel) return;
        const chip = document.createElement('span');
        chip.className = 'related-chip';
        chip.textContent = `#${rel.num} — ${rel.title}`;
        chip.addEventListener('click', () => selectQuestion(relId));
        relatedEl.appendChild(chip);
      });
      if ((q.related || []).length === 0) {
        relatedEl.innerHTML = '<span class="no-related">None</span>';
      }

      // Rating state
      updateRatingButtons(q.id);
    } else {
      hiddenFace.classList.remove('hidden');
      revealedFace.classList.add('hidden');
      ratingBar.classList.add('hidden');
      metaSection.classList.add('hidden');
    }
  }

  function revealCard() {
    if (state.cardRevealed) return;
    if (!state.selectedId) return;
    state.cardRevealed = true;
    renderMainPanel();
  }

  function toggleLearningMode() {
    state.learningMode = !state.learningMode;
    const btn = document.getElementById('toggle-switch');
    const sidebar = document.querySelector('.sidebar');
    if (btn) btn.classList.toggle('on', state.learningMode);
    if (sidebar) sidebar.classList.toggle('learning-mode', state.learningMode);

    // If switching TO learning mode and a question is already selected, reveal it
    if (state.learningMode && state.selectedId) {
      revealCard();
    }
  }

  function updateRatingButtons(id) {
    const rating = getRating(id);
    ['know', 'shaky', 'review'].forEach(r => {
      const btn = document.getElementById(`rate-${r}`);
      btn.className = 'rate-btn' + (rating === r ? ` active-${r}` : '');
    });
  }

  function setRating(id, rating) {
    const current = getRating(id);
    if (current === rating) {
      // Toggle off
      delete state.ratings[id];
    } else {
      state.ratings[id] = rating;
    }
    saveRatings();
    updateRatingButtons(id);
    // Re-render list to update dot
    renderList();
  }

  // ── Tag filter ─────────────────────────────────────────────────
  function filterByTag(tag) {
    if (state.tagFilter === tag) {
      state.tagFilter = null;
    } else {
      state.tagFilter = tag;
    }
    updateTagFilterBar();
    renderList();
    renderMainPanel(); // refresh chips highlight
  }

  function updateTagFilterBar() {
    const bar = document.getElementById('tag-filter-bar');
    const chipLabel = document.getElementById('tag-filter-chip-label');
    if (state.tagFilter) {
      bar.classList.remove('hidden');
      chipLabel.textContent = state.tagFilter;
    } else {
      bar.classList.add('hidden');
    }
  }

  // ── Navigation ─────────────────────────────────────────────────
  function navigateList(direction) {
    const filtered = getSortedFilteredQuestions();
    if (filtered.length === 0) return;
    let idx = filtered.findIndex(q => q.id === state.selectedId);
    if (idx === -1) {
      idx = direction === 1 ? 0 : filtered.length - 1;
    } else {
      idx = (idx + direction + filtered.length) % filtered.length;
    }
    selectQuestion(filtered[idx].id);
  }

  function onTopicChange(value) {
    if (value === 'ds') return; // disabled
    state.activeTab = value;
    state.selectedId = null;
    state.cardRevealed = false;
    renderList();
    renderMainPanel(null);
  }

  // ── History navigation ─────────────────────────────────────────
  function historyBack() {
    if (state.historyIdx <= 0) return;
    state.historyIdx--;
    state._historyNav = true;
    selectQuestion(state.history[state.historyIdx]);
    updateHistoryButtons();
  }

  function historyForward() {
    if (state.historyIdx >= state.history.length - 1) return;
    state.historyIdx++;
    state._historyNav = true;
    selectQuestion(state.history[state.historyIdx]);
    updateHistoryButtons();
  }

  function updateHistoryButtons() {
    const backBtn = document.getElementById('hist-back');
    const fwdBtn = document.getElementById('hist-fwd');
    if (backBtn) backBtn.disabled = state.historyIdx <= 0;
    if (fwdBtn) fwdBtn.disabled = state.historyIdx >= state.history.length - 1;
  }

  // ── Search toggle ──────────────────────────────────────────────
  function toggleSearch() {
    const expand = document.getElementById('search-expand');
    const iconBtn = document.getElementById('search-icon-btn');
    const input = document.getElementById('search-input');
    if (expand.classList.contains('open')) {
      closeSearch();
    } else {
      expand.classList.add('open');
      iconBtn.classList.add('active');
      setTimeout(() => input.focus(), 50);
    }
  }

  function closeSearch() {
    const expand = document.getElementById('search-expand');
    const iconBtn = document.getElementById('search-icon-btn');
    const input = document.getElementById('search-input');
    expand.classList.remove('open');
    iconBtn.classList.remove('active');
    input.value = '';
    state.searchQuery = '';
    renderList();
  }

  // ── Event wiring ───────────────────────────────────────────────
  function init() {
    loadRatings();

    // Topic dropdown
    const topicSelect = document.getElementById('topic-select');
    if (topicSelect) {
      topicSelect.value = state.activeTab;
    }

    // Search
    document.getElementById('search-input').addEventListener('input', e => {
      state.searchQuery = e.target.value.trim();
      renderList();
    });

    // Difficulty filter — multi-select, click to toggle
    document.querySelectorAll('#diff-filters .pill[data-diff]').forEach(btn => {
      const diff = btn.dataset.diff;
      if (!diff || diff === 'all') return;
      btn.addEventListener('click', () => {
        if (state.diffFilters.has(diff)) {
          state.diffFilters.delete(diff);
          btn.classList.remove('active');
        } else {
          state.diffFilters.add(diff);
          btn.classList.add('active');
        }
        renderList();
      });
    });

    // Status filter (single select, click again to deselect)
    document.querySelectorAll('#status-filters .pill').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.dataset.status;
        if (state.statusFilter === val) {
          state.statusFilter = null;
        } else {
          state.statusFilter = val;
        }
        // Update all pill classes
        document.querySelectorAll('#status-filters .pill').forEach(b => {
          b.classList.remove('active', 'active-know', 'active-shaky', 'active-review', 'active-star', 'active-unseen');
        });
        if (state.statusFilter) {
          const activeMap = {
            star: 'active-star',
            know: 'active-know',
            shaky: 'active-shaky',
            review: 'active-review',
            unseen: 'active-unseen',
          };
          btn.classList.add(activeMap[state.statusFilter] || 'active');
        }
        renderList();
      });
    });

    // Tag filter clear
    document.getElementById('tag-filter-clear').addEventListener('click', () => {
      state.tagFilter = null;
      updateTagFilterBar();
      renderList();
      renderMainPanel();
    });

    // Flashcard reveal
    document.getElementById('card-hidden-face').addEventListener('click', revealCard);

    // Rating buttons
    ['know', 'shaky', 'review'].forEach(r => {
      document.getElementById(`rate-${r}`).addEventListener('click', () => {
        if (state.selectedId) setRating(state.selectedId, r);
      });
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', e => {
      // Don't fire when typing in search
      if (e.target === document.getElementById('search-input')) return;

      switch (e.key) {
        case 'j':
        case 'ArrowDown':
          e.preventDefault();
          navigateList(1);
          break;
        case 'k':
        case 'ArrowUp':
          e.preventDefault();
          navigateList(-1);
          break;
        case ' ':
          e.preventDefault();
          revealCard();
          break;
        case '1':
          if (state.selectedId && state.cardRevealed) setRating(state.selectedId, 'know');
          break;
        case '2':
          if (state.selectedId && state.cardRevealed) setRating(state.selectedId, 'shaky');
          break;
        case '3':
          if (state.selectedId && state.cardRevealed) setRating(state.selectedId, 'review');
          break;
        case 'ArrowLeft':
          e.preventDefault();
          historyBack();
          break;
        case 'ArrowRight':
          e.preventDefault();
          historyForward();
          break;
        case 'Escape':
          closeSearch();
          break;
      }
    });

    renderList();
    renderMainPanel();
  }

  // ── Utility ────────────────────────────────────────────────────
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Resizable Sidebar ──────────────────────────────────────────
  function initResize() {
    const handle = document.getElementById('resize-handle');
    const sidebar = document.querySelector('.sidebar');
    if (!handle || !sidebar) return;

    // Restore saved width
    const saved = localStorage.getItem('sidebar-width');
    if (saved) sidebar.style.width = saved + 'px';

    let startX, startW;

    handle.addEventListener('mousedown', e => {
      startX = e.clientX;
      startW = sidebar.offsetWidth;
      handle.classList.add('dragging');
      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'col-resize';

      const onMove = e => {
        const dx = e.clientX - startX;
        const newW = Math.min(520, Math.max(220, startW + dx));
        sidebar.style.width = newW + 'px';
      };

      const onUp = () => {
        handle.classList.remove('dragging');
        document.body.style.userSelect = '';
        document.body.style.cursor = '';
        localStorage.setItem('sidebar-width', sidebar.offsetWidth);
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };

      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  }

  // ── Boot ───────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => { init(); initResize(); });
</script>
</body>
</html>
